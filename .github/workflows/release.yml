name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dab-x86_64-linux
          # - os: ubuntu-latest
            # target: aarch64-unknown-linux-gnu
            # artifact: dab-aarch64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: dab-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dab-aarch64-macos

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Install cross-compilation tools (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
        
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          # Add ARM64 architecture and repositories
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          
          # Install cross-compilation toolchain
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          
          # Install ARM64 development libraries
          sudo apt-get install -y libasound2-dev:arm64
        else
          # Install native ALSA development libraries for x86_64
          sudo apt-get install -y libasound2-dev
        fi
    
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.target }}-
          ${{ runner.os }}-cargo-
    
    - name: Build
      run: |
        # Build for target platform
        cargo build --release --target ${{ matrix.target }}
    
    - name: Run tests
      if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin'
      run: cargo test --release --target ${{ matrix.target }}
    
    - name: Prepare artifact
      run: |
        mkdir -p artifacts
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          cp target/${{ matrix.target }}/release/dab artifacts/${{ matrix.artifact }}
        else
          cp target/${{ matrix.target }}/release/dab artifacts/${{ matrix.artifact }}
        fi
        chmod +x artifacts/${{ matrix.artifact }}
        
        # Create checksum
        cd artifacts
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
        else
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
        fi
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -type f \( -name 'dab-*' -o -name '*.sha256' \) -exec cp {} release/ \;
        ls -la release/
    
    - name: Extract version and changelog
      id: extract_info
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
        # Extract version from Cargo.toml
        CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        echo "cargo_version=$CARGO_VERSION" >> $GITHUB_OUTPUT
        
        # Check if versions match
        if [ "$VERSION" != "v$CARGO_VERSION" ]; then
          echo "Error: Tag version ($VERSION) doesn't match Cargo.toml version (v$CARGO_VERSION)"
          exit 1
        fi
        
        # Generate changelog since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          echo "## Changes since $LAST_TAG" > changelog.md
          git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD >> changelog.md
        else
          echo "## Initial Release" > changelog.md
          echo "First release of dab.rs music player." >> changelog.md
        fi
        
        # Get commit count and date
        COMMIT_COUNT=$(git rev-list --count HEAD)
        BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
        echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
        echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
    
    - name: Create release notes
      run: |
        cat > release_notes.md << EOF
        # DAB Music Player ${{ steps.extract_info.outputs.version }}
        
        Unix-style command-line music player inspired by cmus, built with Rust.
        
        **Build Information:**
        - Version: ${{ steps.extract_info.outputs.version }}
        - Build Date: ${{ steps.extract_info.outputs.build_date }}
        - Total Commits: ${{ steps.extract_info.outputs.commit_count }}
        
        **Supported Platforms:**
        - 🐧 Linux x86_64 (Intel/AMD)
        - 🍎 macOS x86_64 (Intel)
        - 🍎 macOS ARM64 (Apple Silicon)
        
        **Features:**
        - TUI interface inspired by cmus
        - Online music search and streaming
        - Local file caching
        - Audio visualization
        - Queue management
        - Support for multiple audio formats
        
        **Installation:**
        
        \`\`\`bash
        # Download the appropriate binary for your platform
        wget https://github.com/yanyaoer/dab.rs/releases/download/${{ steps.extract_info.outputs.version }}/dab-[platform]
        
        # Make it executable
        chmod +x dab-[platform]
        
        # Move to PATH (optional)
        sudo mv dab-[platform] /usr/local/bin/dab
        \`\`\`
        
        **Verification:**
        Each binary comes with a SHA256 checksum file for verification:
        \`\`\`bash
        sha256sum -c dab-[platform].sha256
        \`\`\`
        
        ---
        
        $(cat changelog.md)
        EOF
    
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ steps.extract_info.outputs.version }} \
          --title "DAB Music Player ${{ steps.extract_info.outputs.version }}" \
          --notes-file release_notes.md \
          --latest \
          release/*
