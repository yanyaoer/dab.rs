name: Nightly Build

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: dab-x86_64-linux
          # - os: ubuntu-latest
            # target: aarch64-unknown-linux-gnu
            # artifact: dab-aarch64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: dab-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: dab-aarch64-macos

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    
    - name: Install cross-compilation tools (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
        
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          # Add ARM64 architecture and repositories
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          
          # Install cross-compilation toolchain
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          
          # Install ARM64 development libraries
          sudo apt-get install -y libasound2-dev:arm64
        else
          # Install native ALSA development libraries for x86_64
          sudo apt-get install -y libasound2-dev
        fi
    
    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.target }}-
          ${{ runner.os }}-cargo-
    
    - name: Build
      run: |
        # Build for target platform
        cargo build --release --target ${{ matrix.target }}
    
    - name: Prepare artifact
      run: |
        mkdir -p artifacts
        if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
          cp target/${{ matrix.target }}/release/dab artifacts/${{ matrix.artifact }}
        else
          cp target/${{ matrix.target }}/release/dab artifacts/${{ matrix.artifact }}
        fi
        chmod +x artifacts/${{ matrix.artifact }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: artifacts/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Prepare release files
      run: |
        mkdir -p release
        find artifacts -name 'dab-*' -type f -exec cp {} release/ \;
        ls -la release/
    
    - name: Delete existing nightly release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Delete nightly tag and release if they exist
        if gh release view nightly >/dev/null 2>&1; then
          gh release delete nightly --yes
        fi
        if git tag | grep -q "^nightly$"; then
          git tag -d nightly || true
          git push origin :refs/tags/nightly || true
        fi
      continue-on-error: true
    
    - name: Create nightly release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get commit info
        COMMIT_SHA=$(git rev-parse --short HEAD)
        COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
        
        # Create release notes
        cat > release_notes.md << EOF
        # Nightly Build - $COMMIT_DATE
        
        Automated nightly release for dab.rs music player.
        
        **Built from:**
        - Commit: \`$COMMIT_SHA\`
        - Branch: \`dev\`
        - Date: $COMMIT_DATE
        
        **Supported Platforms:**
        - Linux x86_64 (Intel/AMD)
        - Linux ARM64 (aarch64)  
        - macOS x86_64 (Intel)
        - macOS ARM64 (Apple Silicon)
        
        **Installation:**
        1. Download the appropriate binary for your platform
        2. Make it executable: \`chmod +x dab-*\`
        3. Move to PATH: \`sudo mv dab-* /usr/local/bin/dab\` (Linux/macOS)
        
        ⚠️ **Note:** This is a nightly build and may contain unstable features.
        EOF
        
        # Create nightly tag
        git tag nightly
        git push origin nightly
        
        # Create release
        gh release create nightly \
          --title "Nightly Build - $COMMIT_DATE" \
          --notes-file release_notes.md \
          --prerelease \
          --latest=false \
          release/*
