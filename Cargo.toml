[package]
name = "dab"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[[bin]]
name = "dab"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
futures-util = "0.3"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11.2"
chrono = { version = "0.4", features = ["serde"] }

# Audio playback
rodio = { version = "0.20.1", features = ["mp3", "wav", "flac", "vorbis"] }
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "flac", "wav"] }

# Missing dependencies
dirs = "5.0"
md5 = "0.7"

# HTTP client for online audio
reqwest = { version = "0.12", features = ["stream", "json"] }
url = "2.5"
urlencoding = "2.1"

# File system and caching
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"

# ID3 tag reading
id3 = "1.13"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Image handling for covers (kitty protocol)
image = "0.25"
base64 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Audio visualization
cpal = "0.15.1"